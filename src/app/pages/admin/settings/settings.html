<div class="settings-container">

  <h2>Settings</h2>

  <div class="settings-form">

    <div class="form-group">
      <label for="unitFare">Unit Fare</label>

      <input
        id="unitFare"
        type="number"
        [(ngModel)]="settings().unitFare"
        [disabled]="!isEditMode()"
      />
    </div>

    <div class="form-group">
      <label for="minimumFare">Minimum Fare</label>

      <input
        id="minimumFare"
        type="number"
        [(ngModel)]="settings().minimumFare"
        [disabled]="!isEditMode()"
      />
    </div>

  </div>

  @if (!isEditMode()) {

    <button
      type="button"
      (click)="editSettings()">
      Edit Settings
    </button>

  } @else {

    <div class="action-buttons">

      <button
        type="button"
        (click)="cancelEdit()">
        Cancel
      </button>

      <button
        type="button"
        (click)="updateSettings()">
        Update
      </button>

    </div>

  }

</div>
