<div class="verify-container">
  <div class="verify-card">
    <div class="icon">📧</div>

    <h2>Verify Your OTP</h2>

    <p class="message">
      A verification code has been sent to
      <strong>{{ email() }}</strong
      >.
      <br />
      Please enter the 6-digit OTP below to <strong>{{ verification }}.</strong>
    </p>

    <input type="text" maxlength="6" placeholder="Enter OTP" [(ngModel)]="otp" class="otp-input" />

    <button class="verify-btn" (click)="verifyOtp()">Verify</button>

    <p class="resend">
      Didn't receive the code?
      <button type="btn btn-outline" (click)="resendOtp()">Resend OTP</button>
    </p>
  </div>
</div>
