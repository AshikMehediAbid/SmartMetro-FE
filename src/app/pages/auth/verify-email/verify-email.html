<div class="verify-container">
  <div class="verify-card">
    <div class="icon">📧</div>

    <h2>Verify Your Email</h2>

    <p class="message">
      A verification code has been sent to
      <strong>{{ email }}</strong>.
      <br>
      Please enter the 6-digit OTP below to verify your email address.
    </p>

    <input
      type="text"
      maxlength="6"
      placeholder="Enter OTP"
      [(ngModel)]="otp"
      class="otp-input">

    <button class="verify-btn" (click)="verifyOtp()">
      Verify
    </button>

    <p class="resend">
      Didn't receive the code?
      <a href="javascript:void(0)" (click)="resendOtp()">Resend OTP</a>
    </p>
  </div>
</div>
