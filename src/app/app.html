<div class="app-layout" [class.logged-out]="!isLoggedIn()">
  @if (isLoggedIn()) {
    <aside class="sidebar" [class.collapsed]="!sidebarOpened()">
      <div class="sidebar-header">
        <h2 *ngIf="sidebarOpened()"></h2>
        <button class="menu-toggle" type="button" (click)="toggleSidebar()">
          {{ sidebarOpened() ? '☰' : 'Menu' }}
        </button>
      </div>
      <nav *ngIf="sidebarOpened()">
        <a routerLink="/home" routerLinkActive="active">Home</a>
        <a routerLink="/user-profile" routerLinkActive="active">Profile</a>
        <a routerLink="/distance&fare" routerLinkActive="active">Station Distance & Fare</a>
        @if (isAdmin()) {
          <a routerLink="/stations" routerLinkActive="active">Station Management</a>

          <a routerLink="/settings" routerLinkActive="active">Settings</a>
        }
        @else {
          <a routerLink="/ticket-purchase" routerLinkActive="active">Purchase Ticket</a>
        }
        <a routerLink="/tickets" routerLinkActive="active">Tickets</a>
      </nav>
    </aside>
  }

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<app-toast />
