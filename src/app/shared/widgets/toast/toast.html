@if (toasts().length) {
  <div class="app-toast-container">
    @for (toast of toasts(); track toast.id) {
      <div
        class="app-toast"
        [class.app-toast-success]="toast.type === 'success'"
        [class.app-toast-error]="toast.type === 'error'"
        [class.app-toast-info]="toast.type === 'info'"
      >
        {{ toast.message }}
      </div>
    }
  </div>
}
